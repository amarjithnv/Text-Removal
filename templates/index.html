<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Cleanup Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        textarea {
            min-height: 240px;
            resize: vertical;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-200 to-gray-300">

    <div class="max-w-4xl mx-auto py-8 px-4">

        <h1 class="text-1xl font-bold text-center mb-2 tracking-wide text-gray-900">
            Text Cleanup Tool
        </h1>

        <form method="POST" action="/" class="shadow-xl rounded-2xl p-2 space-y-6 border border-gray-300">

            <div class="p-4 rounded-lg border border-gray-300 space-y-5">           

                <div class="space-y-3">
                    <label class="flex items-center gap-2 text-base text-gray-900">
                        <input type="radio" name="removal_type" value="markers" class="h-4 w-4" checked>
                        Remove between Start and End markers
                    </label>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phrase 1 / Start Marker</label>
                            <input type="text" name="phrase1"
                                   class="w-50 p-1 text-base border border-gray-300 rounded-lg"
                                   placeholder="Start marker">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phrase 2 / End Marker</label>
                            <input type="text" name="phrase2"
                                   class="w-50 p-1 text-base border border-gray-300 rounded-lg"
                                   placeholder="End marker">
                        </div>
                    </div>
                </div>

                <!-- Option 2 -->
                <div class="space-y-3">
                    <label class="flex items-center gap-2 text-base text-gray-900">
                        <input type="radio" name="removal_type" value="phrase" class="h-4 w-4">
                        Remove phrase only
                    </label>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phrase</label>
                        <input type="text" name="single_phrase"
                               class="w-full p-2 text-base border border-gray-300 rounded-lg"
                               placeholder="Phrase to remove">
                    </div>
                </div>

            </div>

            <!-- Text Area -->
            <div>
                <label class="block text-lg font-semibold text-gray-800 mb-2">
                    Enter or View Cleaned Text
                </label>

                <textarea name="text"
                    class="w-full text-base p-3 border border-gray-300 rounded-lg bg-gray-50 leading-normal">{{ cleaned_text or original_text }}</textarea>
            </div>

            <div class="flex justify-center">
                <button class="px-8 py-3 text-lg bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 active:scale-95 transition">
                    Clean Text
                </button>
            </div>

        </form>
    </div>

</body>
</html>
