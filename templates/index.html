<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Cleanup Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; /* Remove default body margin */
            background-color: #f8f9fa; 
            display: flex; /* Activate Flexbox */
            min-height: 100vh; /* Ensure full height */
        }
        
        /* SIDEBAR STYLES */
        .sidebar {
            width: 200px; /* Fixed width */
            background-color: #343a40; /* Dark background */
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            flex-shrink: 0; /* Prevents sidebar from shrinking */
        }
        .sidebar h3 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 25px;
            color: #ffffff;
            border-bottom: 1px solid #495057;
            padding-bottom: 10px;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav a {
            display: block;
            text-decoration: none;
            color: #ced4da; /* Light gray text */
            padding: 10px 10px;
            transition: background-color 0.2s, color 0.2s;
            border-radius: 4px;
        }
        .sidebar-nav a:hover {
            background-color: #495057; /* Slightly lighter background on hover */
            color: white;
        }
        .sidebar-nav .active a {
            color: #38bdf8; /* Highlight current page with Tailwind Sky-400 */
            font-weight: bold;
            background-color: #212529;
        }
        textarea {
            min-height: 240px;
            resize: vertical;
        }
        .tool-card {
            text-align: center;
            padding: 25px 35px;
            margin: 0 10px;
            border: 1px solid #dee2e6; /* Subtle border */
            border-radius: 8px; /* Rounded corners */
            background-color: #ffffff; /* White background for the card */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); /* Soft, professional shadow */
            transition: transform 0.2s, box-shadow 0.2s;
            max-width: 300px;
        }

        .tool-card:hover {
            transform: translateY(-3px); /* Slight lift on hover */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        /* Heading Style */
        .tool-card h2 {
            font-size: 1.5rem; /* Larger, clearer heading */
            color: #343a40; /* Darker text for readability */
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff; /* Accent color under the title */
            padding-bottom: 10px;
            display: inline-block; /* Makes the border only go under the text */
        }

        /* Anchor/Link Styling */
        .tool-link {
            text-decoration: none; /* Remove underline */
            color: #ffffff; /* White text on button */
            background-color: #007bff; /* Primary action color (blue) */
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block; /* Allows padding and width */
            transition: background-color 0.2s, transform 0.1s;
        }

        .tool-link:hover {
            background-color: #0056b3; /* Darker blue on hover */
            transform: scale(1.02);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-200 to-gray-300">

    <div class="sidebar">
        <h3>Other Tools</h3>
        <ul class="sidebar-nav">
            <li class="active"><a href="/">Text Cleanup</a></li>
            <li><a href="/scraper">Web Scraper</a></li>
        </ul>
    </div>

    <div class="max-w-4xl mx-auto py-8 px-4">

        <h1 class="text-1xl font-bold text-center mb-2 tracking-wide text-gray-900">
            Text Cleanup Tool
        </h1>

        <form method="POST" action="/" class="shadow-xl rounded-2xl p-2 space-y-6 border border-gray-300">

            <div class="p-4 rounded-lg border border-gray-300 space-y-5">           

                <div class="space-y-3">
                    <label class="flex items-center gap-2 text-base text-gray-900">
                        <input type="radio" name="removal_type" value="markers" class="h-4 w-4" checked>
                        Remove between Start and End markers
                    </label>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phrase 1 / Start Marker</label>
                            <input type="text" name="phrase1"
                                   class="w-50 p-1 text-base border border-gray-300 rounded-lg"
                                   placeholder="Start marker">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phrase 2 / End Marker</label>
                            <input type="text" name="phrase2"
                                   class="w-50 p-1 text-base border border-gray-300 rounded-lg"
                                   placeholder="End marker">
                        </div>
                    </div>
                </div>

                <!-- Option 2 -->
                <div class="space-y-3">
                    <label class="flex items-center gap-2 text-base text-gray-900">
                        <input type="radio" name="removal_type" value="phrase" class="h-4 w-4">
                        Remove phrase only
                    </label>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phrase</label>
                        <input type="text" name="single_phrase"
                               class="w-full p-2 text-base border border-gray-300 rounded-lg"
                               placeholder="Phrase to remove">
                    </div>
                </div>

            </div>

            <!-- Text Area -->
            <div>
                <label class="block text-lg font-semibold text-gray-800 mb-2">
                    Enter or View Cleaned Text
                </label>

                <textarea name="text"
                    class="w-full text-base p-3 border border-gray-300 rounded-lg bg-gray-50 leading-normal">{{ cleaned_text or original_text }}</textarea>
            </div>

            <div class="flex justify-center">
                <button class="px-8 py-3 text-lg bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 active:scale-95 transition">
                    Clean Text
                </button>
            </div>

        </form>
    </div>

</body>
</html>
